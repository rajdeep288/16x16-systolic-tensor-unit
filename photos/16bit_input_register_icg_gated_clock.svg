  <text x="609" y="436" class="dff-num">10</text>
  <text x="609" y="458" class="dff-text">DFF</text>

  <line x1="675" y1="320" x2="675" y2="380" class="thin-wire"/>
  <rect x="649" y="380" width="52" height="96" class="dff-box"/>
  <!-- Clock pin triangle at top -->
  <line x1="669" y1="380" x2="675" y2="388" class="thin-wire"/>
  <line x1="681" y1="380" x2="675" y2="388" class="thin-wire"/>
  <text x="675" y="403" class="dff-clk">CLK</text>
  <line x1="654" y1="412" x2="696" y2="412" class="divider"/>
  <text x="675" y="436" class="dff-num">9</text>
  <text x="675" y="458" class="dff-text">DFF</text>

  <line x1="741" y1="320" x2="741" y2="380" class="thin-wire"/>
  <rect x="715" y="380" width="52" height="96" class="dff-box"/>
  <!-- Clock pin triangle at top -->
  <line x1="735" y1="380" x2="741" y2="388" class="thin-wire"/>
  <line x1="747" y1="380" x2="741" y2="388" class="thin-wire"/>
  <text x="741" y="403" class="dff-clk">CLK</text>
  <line x1="720" y1="412" x2="762" y2="412" class="divider"/>
  <text x="741" y="436" class="dff-num">8</text>
  <text x="741" y="458" class="dff-text">DFF</text>

  <!-- GCLK Distribution Bus -->
  <line x1="933" y1="320" x2="1131" y2="320" class="wire-gclk"/>

  <line x1="933" y1="320" x2="933" y2="380" class="thin-wire"/>
  <rect x="907" y="380" width="52" height="96" class="dff-box"/>
  <!-- Clock pin triangle at top -->
  <line x1="927" y1="380" x2="933" y2="388" class="thin-wire"/>
  <line x1="939" y1="380" x2="933" y2="388" class="thin-wire"/>
  <text x="933" y="403" class="dff-clk">CLK</text>
  <line x1="912" y1="412" x2="954" y2="412" class="divider"/>
  <text x="933" y="436" class="dff-num">7</text>
  <text x="933" y="458" class="dff-text">DFF</text>

  <line x1="999" y1="320" x2="999" y2="380" class="thin-wire"/>
  <rect x="973" y="380" width="52" height="96" class="dff-box"/>
  <!-- Clock pin triangle at top -->
  <line x1="993" y1="380" x2="999" y2="388" class="thin-wire"/>
  <line x1="1005" y1="380" x2="999" y2="388" class="thin-wire"/>
  <text x="999" y="403" class="dff-clk">CLK</text>
