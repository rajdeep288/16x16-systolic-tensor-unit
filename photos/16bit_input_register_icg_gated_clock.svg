  <text x="411" y="436" class="dff-num">13</text>
  <text x="411" y="458" class="dff-text">DFF</text>

  <line x1="477" y1="320" x2="477" y2="380" class="thin-wire"/>
  <rect x="451" y="380" width="52" height="96" class="dff-box"/>
  <!-- Clock pin triangle at top -->
  <line x1="471" y1="380" x2="477" y2="388" class="thin-wire"/>
  <line x1="483" y1="380" x2="477" y2="388" class="thin-wire"/>
  <text x="477" y="403" class="dff-clk">CLK</text>
  <line x1="456" y1="412" x2="498" y2="412" class="divider"/>
  <text x="477" y="436" class="dff-num">12</text>
  <text x="477" y="458" class="dff-text">DFF</text>

  <line x1="543" y1="320" x2="543" y2="380" class="thin-wire"/>
  <rect x="517" y="380" width="52" height="96" class="dff-box"/>
  <!-- Clock pin triangle at top -->
  <line x1="537" y1="380" x2="543" y2="388" class="thin-wire"/>
  <line x1="549" y1="380" x2="543" y2="388" class="thin-wire"/>
  <text x="543" y="403" class="dff-clk">CLK</text>
