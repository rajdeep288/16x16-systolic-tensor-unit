  <line x1="1323" y1="320" x2="1323" y2="380" class="thin-wire"/>
  <rect x="1297" y="380" width="52" height="96" class="dff-box"/>
  <!-- Clock pin triangle at top -->
  <line x1="1317" y1="380" x2="1323" y2="388" class="thin-wire"/>
  <line x1="1329" y1="380" x2="1323" y2="388" class="thin-wire"/>
  <text x="1323" y="403" class="dff-clk">CLK</text>
  <line x1="1302" y1="412" x2="1344" y2="412" class="divider"/>
  <text x="1323" y="436" class="dff-num">3</text>
  <text x="1323" y="458" class="dff-text">DFF</text>

  <line x1="1389" y1="320" x2="1389" y2="380" class="thin-wire"/>
  <rect x="1363" y="380" width="52" height="96" class="dff-box"/>
  <!-- Clock pin triangle at top -->
  <line x1="1383" y1="380" x2="1389" y2="388" class="thin-wire"/>
  <line x1="1395" y1="380" x2="1389" y2="388" class="thin-wire"/>
  <text x="1389" y="403" class="dff-clk">CLK</text>
  <line x1="1368" y1="412" x2="1410" y2="412" class="divider"/>
  <text x="1389" y="436" class="dff-num">2</text>
  <text x="1389" y="458" class="dff-text">DFF</text>

  <line x1="1455" y1="320" x2="1455" y2="380" class="thin-wire"/>
  <rect x="1429" y="380" width="52" height="96" class="dff-box"/>
  <!-- Clock pin triangle at top -->
  <line x1="1449" y1="380" x2="1455" y2="388" class="thin-wire"/>
  <line x1="1461" y1="380" x2="1455" y2="388" class="thin-wire"/>
  <text x="1455" y="403" class="dff-clk">CLK</text>
  <line x1="1434" y1="412" x2="1476" y2="412" class="divider"/>
  <text x="1455" y="436" class="dff-num">1</text>
