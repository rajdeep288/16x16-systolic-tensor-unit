  <text x="1065" y="436" class="dff-num">5</text>
  <text x="1065" y="458" class="dff-text">DFF</text>

  <line x1="1131" y1="320" x2="1131" y2="380" class="thin-wire"/>
  <rect x="1105" y="380" width="52" height="96" class="dff-box"/>
