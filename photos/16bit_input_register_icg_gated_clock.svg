  <text x="510" y="535" class="seg-title">S2 — UPPER SEGMENT (MSBs)</text>
  <text x="510" y="559" class="seg-sub">8 register bits: [15:8]</text>
  <text x="510" y="581" class="seg-mode">Clock: GCLK_S2 (Frozen at 0 in INT4 / INT8)</text>
  <text x="1032" y="535" class="seg-title">S1 — MIDDLE SEGMENT</text>
  <text x="1032" y="559" class="seg-sub">4 register bits: [7:4]</text>
  <text x="1032" y="581" class="seg-mode">Clock: GCLK_S1 (Frozen at 0 in INT4)</text>
  <text x="1422" y="535" class="seg-title">S0 — LOWER SEGMENT (LSBs)</text>
  <text x="1422" y="559" class="seg-sub">4 register bits: [3:0]</text>
  <text x="1422" y="581" class="seg-mode">Clock: GCLK_S0 (Active in all modes)</text>

  <!-- Bottom Banner -->
  <rect x="120" y="620" width="1560" height="60" rx="8" ry="8" fill="#f5f7fa" stroke="#c8d2dc" stroke-width="1"/>
  <text x="900" y="646" class="banner-text1">True ICG Clock Gating: Inactive segments have their clock pin (GCLK) physically held at 0.</text>
  <text x="900" y="668" class="banner-text2">This eliminates internal clock-tree toggling and saves 66.7% of register dynamic clock power in INT4 mode.</text>
</svg>
